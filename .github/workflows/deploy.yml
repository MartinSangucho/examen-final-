name: ⚙️ CI/CD - Despliegue Final de ulloa

on:
  push:
    # CRITERIO RAMA: Se activa solo en la rama 'ulloa'
    branches: [ "ulloa" ]

permissions:
  contents: read
  packages: write # Permiso necesario para publicar/descargar imágenes de GHCR.

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    env:
      # CRITERIO IMAGEN: Define la imagen correcta (ulloa:1.0.5)
      IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/ulloa:1.0.5

    steps:
      - uses: actions/checkout@v4

      # --- PASOS DE INTEGRACIÓN CONTINUA (CI) ---

      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"

      # CRITERIO 3: Instalar dependencias y pytest para la validación
      - name: Instalar dependencias y pytest
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar pruebas (PyTests)
        run: |
          pytest tests # Asegúrate que tu carpeta de pruebas se llame 'tests'

      - name: 🔐 Login to GitHub Container Registry (Build)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }} # Resuelve a martinsangucho
          password: ${{ secrets.GITHUB_TOKEN }} # Token para publicar

      - name: 🏗️ Build and push Docker image (CRITERIO IMAGEN)
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE_TAG }} # Publica la imagen ulloa:1.0.5

      # --- PASOS DE DESPLIEGUE CONTINUO (CD) ---

      - name: Pasar el stack.yml al servidor
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "stack.yml"
          target: "/home/${{ secrets.VPS_USER }}/despliegue"

      - name: Despliegue de los servicios (CRITERIO STACK)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "🟩 Desplegando stack ulloa con la imagen ${{ env.IMAGE_TAG }}"
            cd ~/despliegue

            # 1. Login para descargar la imagen recién publicada
            # Usamos GITHUB_TOKEN y el dueño del repositorio para el Pull
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker pull ${{ env.IMAGE_TAG }}

            # 2. Borrar el stack anterior (CRITERIO 1: ulloa)
            docker stack rm ulloa || true
            sleep 30

            # 3. Desplegar stack (CRITERIO 1: ulloa)
            echo "==> Desplegando stack ulloa..."
            docker stack deploy -c stack.yml --with-registry-auth ulloa

            docker ps