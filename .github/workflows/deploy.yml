name: ⚙️ CI/CD Combinado - Despliegue ulloa

on:
  push:
    branches: [ "ulloa" ] # CRITERIO RAMA: Solo se activa en la rama 'ulloa'

permissions:
  contents: read
  packages: write # Necesario para publicar y descargar imágenes de GHCR.

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    env:
      # CRITERIO IMAGEN: Definimos la etiqueta para construir, empujar y descargar.
      IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/ulloa:1.0.5

    steps:
      - uses: actions/checkout@v4 # 1. Descargar el código

      # --- PASOS DE INTEGRACIÓN CONTINUA (CI: Tests y Build) ---

      - name: 🐍 Set up Python and Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Usamos una versión moderna de Python

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt pytest # Instalar dependencias y pytest

      - name: 🧪 Run Tests (CRITERIO 3: Pruebas)
        run: pytest # Ejecutar pruebas antes de construir la imagen

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }} # Usamos el dueño del repositorio
          password: ${{ secrets.GITHUB_TOKEN }} # Usamos el token estándar

      - name: 🏗️ Build and push Docker image (CRITERIO IMAGEN)
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE_TAG }} # Usar la etiqueta definida

      # --- PASOS DE DESPLIEGUE CONTINUO (CD: SSH y Deploy) ---

      - name: 🧾 Mostrar variables básicas (SOLO el HOST y USER)
        run: |
          echo "Probando conexión SSH con:"
          echo "Host: ${{ secrets.VPS_HOST }}"
          echo "Usuario: ${{ secrets.VPS_USER }}"
          echo "Puerto: ${{ secrets.VPS_SSH_PORT }}"
          # IMPORTANTE: No exponer secretos sensibles como VPS_PASSWORD en logs
          echo "Password: *** (redacted)"

      - name: 🧪 Probar conexión SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "✅ Conexión exitosa desde GitHub Actions"

      - name: Pasar el stack.yml al servidor
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "stack.yml"
          target: "/home/${{ secrets.VPS_USER }}/despliegue"

      - name: Despliegue de los servicios (CRITERIO STACK)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "✅ Desplegando servicios - INTENTO FINAL"
            cd /home/${{ secrets.VPS_USER }}/despliegue

            # 1. Login para descargar la imagen recién creada
            echo "==> Descargando imagen: ${{ env.IMAGE_TAG }}"
            # Usamos el token del flujo para el pull
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker pull ${{ env.IMAGE_TAG }}

            # 2. Borrar el stack anterior (CRITERIO 1: ulloa)
            docker stack rm ulloa || true
            sleep 30

            # 3. Desplegar (CRITERIO 1: ulloa)
            echo "==> Desplegando stack ulloa..."
            docker stack deploy -c stack.yml --with-registry-auth ulloa

            docker ps