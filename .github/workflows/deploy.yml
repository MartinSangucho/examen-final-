name: Python application

on:
  push:
    branches: [ "ulloa" ]   # ¡Rama correcta!

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/ulloa:1.0.5

    steps:
      - uses: actions/checkout@v4

      - name: 🧾 Mostrar variables básicas (solo locales, no secretos)
        run: |
          echo "Probando conexión SSH con:"
          # echo "Host: ${{ secrets.VPS_HOST }}"
          # echo "Usuario: ${{ secrets.VPS_USER }}"
          # echo "Puerto: ${{ secrets.VPS_SSH_PORT }}"
          echo "Password: *** (redacted)"

      - name: 🧪 Probar conexión SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}          # SECRET
          username: ${{ secrets.VPS_USER }}      # SECRET
          password: ${{ secrets.VPS_PASSWORD }}  # SECRET
          port: ${{ secrets.VPS_SSH_PORT }}      # SECRET
          script: |
            echo "✅ Conexión exitosa desde GitHub Actions"
            hostname
            whoami
            uptime

      - name: Pasar el stack.yml al servidor
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}          # SECRET
          username: ${{ secrets.VPS_USER }}      # SECRET
          password: ${{ secrets.VPS_PASSWORD }}  # SECRET
          port: ${{ secrets.VPS_SSH_PORT }}      # SECRET
          source: "stack.yml"
          target: "/home/${{ secrets.VPS_USER }}/despliegue"  # SECRET

      - name: Despliegue de los servicios
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}          # SECRET
          username: ${{ secrets.VPS_USER }}      # SECRET
          password: ${{ secrets.VPS_PASSWORD }}  # SECRET
          port: ${{ secrets.VPS_SSH_PORT }}      # SECRET
          script: |
            echo "✅ Desplegando servicios"
            echo "Iniciando despliegue en /home/${{ secrets.VPS_USER }}/despliegue"   # SECRET
            cd /home/${{ secrets.VPS_USER }}/despliegue                               # SECRET

            echo "==> Descargando imagen: ${{ env.IMAGE_TAG }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin  # SECRET
            docker pull ${{ env.IMAGE_TAG }}

            docker stack rm ulloa || true 
            sleep 30

            echo "==> Desplegando stack ulloa..."
            docker stack deploy -c stack.yml --with-registry-auth ulloa
